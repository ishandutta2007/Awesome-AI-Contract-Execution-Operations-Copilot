<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.15)" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .dynamic-orb-1 {
      animation: floatOrb1 14s ease-in-out infinite alternate;
    }
    .dynamic-orb-2 {
      animation: floatOrb2 16s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashMove 30s linear infinite;
    }
    .flow-pulse {
      animation: pulseNode 3s ease-in-out infinite alternate;
    }
    .badge-float {
      animation: floatBadge 6s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(140px, 40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-120px, -50px) scale(1.2); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0% { opacity: 0.35; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }
    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Background Orbs (Non-obstructive) -->
  <g filter="url(#blurGlow)" opacity="0.6">
    <circle class="dynamic-orb-1" cx="200" cy="100" r="140" fill="url(#glowCyan)" />
    <circle class="dynamic-orb-2" cx="1000" cy="300" r="160" fill="url(#glowPurple)" />
  </g>

  <!-- Ambient Dynamic Flow Connections (Background / Peripheral Layer) -->
  <g opacity="0.45" stroke-width="1.5">
    <!-- Top Decorative Pathway -->
    <path class="flow-line" d="M 80,70 Q 300,30 600,75 T 1120,60" fill="none" stroke="#38bdf8" />
    <!-- Bottom Decorative Pathway -->
    <path class="flow-line" d="M 60,360 Q 400,390 750,345 T 1140,365" fill="none" stroke="#c084fc" />

    <!-- Subtle Connected Nodes on Periphery -->
    <circle cx="280" cy="50" r="4" fill="#38bdf8" />
    <circle cx="920" cy="65" r="4" fill="#818cf8" />
    <circle cx="220" cy="375" r="4" fill="#818cf8" />
    <circle cx="980" cy="355" r="4" fill="#c084fc" />
  </g>

  <!-- Visual Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- ================= FOREGROUND HERO CONTENT (Uncompromised Readability) ================= -->

  <!-- Top Category Tag -->
  <g class="badge-float" transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="url(#pillGrad)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="2">
      ✦ AWESOME CURATED DIRECTORY ✦
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
    AI Contract Execution &amp; Operations Copilot
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Post-Signature Obligation Tracking • Agentic Reasoning • Source-Linked Extraction • Self-Hosted CLM
  </text>

  <!-- Interactive Dynamic-Styled Pills (Positioned in Bottom Foreground) -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: Post-Signature Ops -->
    <g transform="translate(-360, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="-85" cy="0" r="5" fill="#38bdf8" class="flow-pulse" />
      <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
        Obligation Extraction
      </text>
    </g>

    <!-- Pill 2: Agentic CLM -->
    <g transform="translate(-120, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1" />
      <circle cx="-85" cy="0" r="5" fill="#818cf8" class="flow-pulse" />
      <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
        Autonomous Workflows
      </text>
    </g>

    <!-- Pill 3: Self-Hosted & Sovereign -->
    <g transform="translate(120, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1" />
      <circle cx="-85" cy="0" r="5" fill="#c084fc" class="flow-pulse" />
      <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
        Open-Source &amp; Sovereign
      </text>
    </g>

    <!-- Pill 4: Citation Network -->
    <g transform="translate(360, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1" />
      <circle cx="-85" cy="0" r="5" fill="#f472b6" class="flow-pulse" />
      <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
        Source-Linked Citations
      </text>
    </g>
  </g>

  <!-- Bottom Accent Status Line -->
  <g transform="translate(600, 360)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      ⚡ Curated for Legal Engineers, General Counsels &amp; Contract Operations Teams ⚡
    </text>
  </g>
</svg>
